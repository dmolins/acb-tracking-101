[project]
name = "acb-tracking-101"
version = "0.1.0"
description = "Learning basketball tracking analytics on SkillCorner's ACB 2025/26 open data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "duckdb>=1.1",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "mplbasketball>=0.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["jupyterlab>=4.2", "ruff>=0.6", "ipykernel>=6.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoops"]

[tool.ruff]
line-length = 100
